server {
    listen 8443 ssl;
    server_name docker.dodokiinvestmenttz.co.tz;

    # SSL Certificates
    ssl_certificate /etc/ssl/mycerts/docker.dodokiinvestmenttz.co.tz.crt;
    ssl_certificate_key /etc/ssl/mycerts/docker.dodokiinvestmenttz.co.tz.key;

    root /var/www/html/public;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.ht {
        deny all;
    }
}